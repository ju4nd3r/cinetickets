services:
  test-db:
    image: postgres:16-alpine
    container_name: cinetickets-test-db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_cinetickets_db
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d test_cinetickets_db']
      interval: 3s
      timeout: 3s
      retries: 5

  test-redis:
    image: redis:7-alpine
    container_name: cinetickets-test-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5

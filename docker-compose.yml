services:
  db:
    image: postgres:16-alpine
    container_name: cinetickets-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinetickets_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinetickets_password}
      POSTGRES_DB: ${POSTGRES_DB:-cinetickets_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - cinetickets_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-cinetickets_user} -d ${POSTGRES_DB:-cinetickets_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cinetickets-network

  redis:
    image: redis:7-alpine
    container_name: cinetickets-redis
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cinetickets-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cinetickets-api
    restart: always
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cinetickets_user}:${POSTGRES_PASSWORD:-cinetickets_password}@db:5432/${POSTGRES_DB:-cinetickets_db}?schema=public
      REDIS_URL: redis://redis:6379
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-480}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cinetickets-network

volumes:
  cinetickets_db_data:

networks:
  cinetickets-network:
    driver: bridge
